services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linkflow
      POSTGRES_PASSWORD: linkflow
      POSTGRES_DB: linkflow
    ports:
      # Host port is configurable because 5432 is very often already taken by
      # a locally installed Postgres. The container port never changes.
      - "${LINKFLOW_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # The service waits on this, so an empty-database race on first boot
    # cannot turn into a crash loop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkflow -d linkflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    command:
      # Phase 1 measures Postgres honestly rather than crippling it: give the
      # baseline enough shared memory that the numbers reflect the design,
      # not a starved default configuration.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200

  linkflow:
    build: .
    environment:
      LINKFLOW_HTTP_ADDR: ":8080"
      LINKFLOW_DATABASE_URL: "postgres://linkflow:linkflow@postgres:5432/linkflow?sslmode=disable"
      LINKFLOW_BASE_URL: "http://localhost:8080"
      LINKFLOW_MAX_POOL_CONNS: "25"
      # "batch" is phase 2 (decoupled write path); "sync" restores the phase 1
      # baseline so the two can be compared on identical hardware.
      LINKFLOW_ANALYTICS_MODE: "${LINKFLOW_ANALYTICS_MODE:-batch}"
      LINKFLOW_ANALYTICS_BUFFER: "${LINKFLOW_ANALYTICS_BUFFER:-10000}"
      LINKFLOW_ANALYTICS_BATCH_SIZE: "${LINKFLOW_ANALYTICS_BATCH_SIZE:-1000}"
      LINKFLOW_ANALYTICS_FLUSH_INTERVAL: "${LINKFLOW_ANALYTICS_FLUSH_INTERVAL:-200ms}"
    ports:
      - "${LINKFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
