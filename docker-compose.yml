services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: linkflow
      POSTGRES_PASSWORD: linkflow
      POSTGRES_DB: linkflow
    ports:
      # Host port is configurable because 5432 is very often already taken by
      # a locally installed Postgres. The container port never changes.
      - "${LINKFLOW_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # The service waits on this, so an empty-database race on first boot
    # cannot turn into a crash loop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkflow -d linkflow"]
      interval: 2s
      timeout: 3s
      retries: 15
    command:
      # Phase 1 measures Postgres honestly rather than crippling it: give the
      # baseline enough shared memory that the numbers reflect the design,
      # not a starved default configuration.
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200

  redis:
    image: redis:7-alpine
    ports:
      - "${LINKFLOW_REDIS_PORT:-6379}:6379"
    # No persistence: this is a cache. Losing it costs a cold start, not data.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: linkflow
      CLICKHOUSE_USER: linkflow
      CLICKHOUSE_PASSWORD: linkflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${LINKFLOW_CLICKHOUSE_PORT:-9000}:9000"
      - "${LINKFLOW_CLICKHOUSE_HTTP_PORT:-8123}:8123"
    ulimits:
      # ClickHouse opens a lot of files per part and warns loudly below this.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      # Probes the container's own hostname, not localhost: ClickHouse binds
      # 0.0.0.0 and ::, but busybox wget resolves "localhost" to ::1, which
      # nothing is listening on -- so a localhost probe fails while the server
      # is perfectly healthy.
      test: ["CMD-SHELL", "wget --spider -q http://$$HOSTNAME:8123/ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  linkflow:
    build: .
    environment:
      LINKFLOW_HTTP_ADDR: ":8080"
      LINKFLOW_DATABASE_URL: "postgres://linkflow:linkflow@postgres:5432/linkflow?sslmode=disable"
      LINKFLOW_BASE_URL: "http://localhost:8080"
      LINKFLOW_MAX_POOL_CONNS: "25"
      # "batch" is phase 2 (decoupled write path); "sync" restores the phase 1
      # baseline so the two can be compared on identical hardware.
      LINKFLOW_ANALYTICS_MODE: "${LINKFLOW_ANALYTICS_MODE:-batch}"
      LINKFLOW_ANALYTICS_BUFFER: "${LINKFLOW_ANALYTICS_BUFFER:-10000}"
      LINKFLOW_ANALYTICS_BATCH_SIZE: "${LINKFLOW_ANALYTICS_BATCH_SIZE:-1000}"
      LINKFLOW_ANALYTICS_FLUSH_INTERVAL: "${LINKFLOW_ANALYTICS_FLUSH_INTERVAL:-200ms}"
      # Empty LINKFLOW_REDIS_ADDR disables the shared tier; 0 local cache
      # items disables the in-process tier. Both are switched off in turn to
      # measure what each tier is actually worth.
      LINKFLOW_REDIS_ADDR: "${LINKFLOW_REDIS_ADDR-redis:6379}"
      LINKFLOW_LOCAL_CACHE_ITEMS: "${LINKFLOW_LOCAL_CACHE_ITEMS-100000}"
      LINKFLOW_CACHE_TTL: "${LINKFLOW_CACHE_TTL:-10m}"
      LINKFLOW_SINGLEFLIGHT: "${LINKFLOW_SINGLEFLIGHT:-true}"
      LINKFLOW_ORIGIN_DELAY: "${LINKFLOW_ORIGIN_DELAY:-0}"
      # "postgres" keeps click events beside the links; "clickhouse" moves
      # them to the columnar store. Switchable so the migration is measured.
      LINKFLOW_ANALYTICS_SINK: "${LINKFLOW_ANALYTICS_SINK:-postgres}"
      LINKFLOW_CLICKHOUSE_ADDR: "clickhouse:9000"
      LINKFLOW_CLICKHOUSE_DATABASE: "linkflow"
      LINKFLOW_CLICKHOUSE_USER: "linkflow"
      LINKFLOW_CLICKHOUSE_PASSWORD: "linkflow"
    ports:
      - "${LINKFLOW_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "${LINKFLOW_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Benchmark runs are short; keeping a couple of hours is plenty and
      # keeps the volume small.
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "${LINKFLOW_GRAFANA_PORT:-3000}:3000"
    environment:
      # Local-only observability stack: no login wall between you and the
      # dashboard you are trying to read mid-benchmark.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
