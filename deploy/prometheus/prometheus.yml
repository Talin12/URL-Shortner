# 2s scrape interval: benchmark runs are 30s, and a 15s default would give
# only two points per run.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: linkflow
    # DNS service discovery rather than a static target: Docker returns one A
    # record per replica, so scaling the service up automatically adds targets
    # instead of silently leaving instances unmonitored.
    dns_sd_configs:
      - names: ["linkflow"]
        type: A
        port: 8080
        refresh_interval: 5s
