events {
    worker_connections 8192;
}

http {
    access_log off;

    upstream linkflow_pool {
        # Docker's embedded DNS returns one A record per replica, and nginx
        # expands all of them into round-robin peers at config load.
        #
        # The trade: resolution happens once at startup, so scaling the service
        # requires an nginx reload to pick up new replicas. The alternative --
        # proxy_pass through a variable with a resolver -- re-resolves per
        # request but bypasses this block entirely, which means no keepalive.
        # That cost is not subtle: measured at 1,645 req/s and p50 73ms with a
        # fresh TCP connection per request, against tens of thousands with the
        # pool. Startup resolution plus keepalive is the right side of that
        # trade for a fixed replica count.
        server linkflow:8080 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://linkflow_pool;

            # HTTP/1.1 with an empty Connection header is what actually enables
            # upstream keepalive; without both, the pool above does nothing.
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Do not follow the 302 upstream: it is the product.
            proxy_redirect off;
        }
    }
}
