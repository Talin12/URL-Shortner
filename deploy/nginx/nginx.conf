events {
    worker_connections 8192;
}

http {
    access_log off;

    # Keep connections open to the replicas. Without this nginx opens a fresh
    # upstream connection per request, and TCP setup dominates the latency it
    # is meant to be distributing.
    upstream linkflow_pool {
        server linkflow:8080 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80;

        # Docker's embedded DNS returns one A record per replica, but nginx
        # resolves an upstream name once at startup and would pin to whichever
        # address it saw first. Re-resolving through a variable is what makes
        # scaling up actually distribute traffic.
        resolver 127.0.0.11 valid=5s ipv6=off;

        location / {
            set $backend "http://linkflow:8080";
            proxy_pass $backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Do not follow the 302 upstream: it is the product.
            proxy_redirect off;
        }
    }
}
